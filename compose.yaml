services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mylibrary -d mylibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - .:/app
    profiles: ["tools"]

volumes:
  postgres_data:

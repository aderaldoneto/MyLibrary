services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mylibrary
      POSTGRES_USER: mylibrary
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mylibrary -d mylibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - .:/app
    profiles: ["tools"]

volumes:
  postgres_data: